<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ROCK CARD DUEL</title>
<style>
body{background:#121212;color:#fff;font-family:Arial,sans-serif;margin:0;padding:0}
header{background:#000;border-bottom:4px solid #ffcc00;padding:10px;text-align:center;position:sticky;top:0;z-index:10}
header h1{margin:0;color:#ffcc00}
#music-bar{background:#222;padding:8px;text-align:center}
#music-bar audio{width:90%;max-width:400px}
#game{display:flex;flex-wrap:wrap;justify-content:center;padding:10px}
.card{width:110px;height:175px;background:#2a2a2a;border:2px solid #444;border-radius:8px;margin:6px;cursor:pointer;overflow:hidden;transition:transform.2s}
.card:hover{transform:translateY(-5px);border-color:#ffcc00}
.card.selected{box-shadow:0 0 12px #ffcc00;border-color:#ffcc00}
.card-img{width:100%;height:65px;object-fit:cover;background:#111}
.card-band{font-size:.6rem;color:#ffcc00;text-transform:uppercase;padding:4px 4px 0}
.card-name{font-size:.7rem;font-weight:bold;padding:2px 4px}
#arena{background:#181818;border:2px dashed #444;margin:10px auto;padding:15px;max-width:500px;text-align:center;border-radius:10px}
.slots{display:flex;justify-content:center;gap:15px;margin:10px 0}
.slot{width:115px;height:175px;border:2px dashed #555;border-radius:8px;display:flex;align-items:center;justify-content:center;background:#222}
#bono-banner{display:none;background:linear-gradient(90deg,red,#ffcc00);padding:8px;margin:10px;border-radius:5px;font-weight:bold;animation: pulse 1s infinite}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.05)}100%{transform:scale(1)}}
button{background:#ffcc00;color:#000;border:none;padding:10px 20px;border-radius:5px;font-weight:bold;cursor:pointer;margin:5px}
button:hover{background:#fff}
#hp{color:#33cc33;font-weight:bold}
</style>
</head>
<body>
<header><h1>🤘 ROCK CARD DUEL ⚡</h1><div>HP: <span id="hp">100</span> | Puntos: <span id="pts">0</span></div></header>
<div id="music-bar">
<audio id="rock-audio" loop controls></audio>
<select id="song-selector" onchange="manualSongChange()"><option value="">-- Elige canción --</option></select>
<div id="bono-info" style="font-size:.8rem;margin-top:5px"></div>
</div>
<div id="bono-banner">🎸 BONO: <span id="bono-text"></span></div>
<div id="arena">
<h3>ARENA DE DUELO</h3>
<div class="slots">
<div class="slot" id="player-slot">TÚ</div>
<div class="slot" id="enemy-slot">ENEMIGO</div>
</div>
<button onclick="executeBattle()">¡PELEAR!</button>
<button onclick="initGame()">Nueva Mano</button>
</div>
<div id="game"></div>
<script>
const placeholder="https://via.placeholder.com/110x65?text=ROCK";
const cancionesBandas={
"The Beatles":["https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3","https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3"],
"Queen":["https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3","https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3"],
"Guns N' Roses":["https://www.soundhelix.com/examples/mp3/SoundHelix-Song-5.mp3","https://www.soundhelix.com/examples/mp3/SoundHelix-Song-6.mp3"],
"Iron Maiden":["https://www.soundhelix.com/examples/mp3/SoundHelix-Song-7.mp3","https://www.soundhelix.com/examples/mp3/SoundHelix-Song-8.mp3"],
"Nirvana":["https://www.soundhelix.com/examples/mp3/SoundHelix-Song-9.mp3","https://www.soundhelix.com/examples/mp3/SoundHelix-Song-10.mp3"],
"Black Sabbath":["https://www.soundhelix.com/examples/mp3/SoundHelix-Song-11.mp3","https://www.soundhelix.com/examples/mp3/SoundHelix-Song-12.mp3"]
};
const masterDeck=[
{nombre:"John Lennon",banda:"The Beatles",rol:"Vocalista",img:"https://upload.wikimedia.org/wikipedia/commons/8/85/John_Lennon_1969_%28cropped%29.jpg"},
{nombre:"Paul McCartney",banda:"The Beatles",rol:"Bajista",img:"https://upload.wikimedia.org/wikipedia/commons/d/d6/Paul_McCartney_in_October_2018.jpg"},
{nombre:"Freddie Mercury",banda:"Queen",rol:"Vocalista",img:"https://upload.wikimedia.org/wikipedia/commons/e/ef/Freddie_Mercury_performing_in_New_Haven%2C_CT%2C_November_1977.jpg"},
{nombre:"Brian May",banda:"Queen",rol:"Guitarrista",img:"https://upload.wikimedia.org/wikipedia/commons/3/33/Brian_May_2017.jpg"},
{nombre:"Axl Rose",banda:"Guns N' Roses",rol:"Vocalista",img:"https://upload.wikimedia.org/wikipedia/commons/7/74/Axl_Rose_2010.jpg"},
{nombre:"Slash",banda:"Guns N' Roses",rol:"Guitarrista",img:"https://upload.wikimedia.org/wikipedia/commons/9/9a/Slash_%282014%29.jpg"},
{nombre:"Steve Harris",banda:"Iron Maiden",rol:"Bajista",img:"https://upload.wikimedia.org/wikipedia/commons/7/7b/Steve_Harris_Iron_Maiden.jpg"},
{nombre:"Bruce Dickinson",banda:"Iron Maiden",rol:"Vocalista",img:"https://upload.wikimedia.org/wikipedia/commons/8/83/Bruce_Dickinson_2008.jpg"},
{nombre:"Kurt Cobain",banda:"Nirvana",rol:"Vocalista",img:"https://upload.wikimedia.org/wikipedia/commons/1/1e/Kurt_Cobain_1991_cropped.jpg"},
{nombre:"Dave Grohl",banda:"Nirvana",rol:"Baterista",img:"https://upload.wikimedia.org/wikipedia/commons/5/5e/Dave_Grohl_2019.jpg"},
{nombre:"Ozzy Osbourne",banda:"Black Sabbath",rol:"Vocalista",img:"https://upload.wikimedia.org/wikipedia/commons/8/8e/Ozzy_Osbourne_2010.jpg"},
{nombre:"Tony Iommi",banda:"Black Sabbath",rol:"Guitarrista",img:"https://upload.wikimedia.org/wikipedia/commons/9/9f/Tony_Iommi_2009.jpg"}
];
let hand=[], selectedIndex=null, hp=100, pts=0;
const audio=document.getElementById("rock-audio");
const selector=document.getElementById("song-selector");
function initSongs(){
  selector.innerHTML='<option value="">-- Elige cancion --</option>';
  for(let banda in cancionesBandas){
    cancionesBandas[banda].forEach((url,i)=>{
      let opt=document.createElement("option");
      opt.value=url; opt.dataset.banda=banda;
      opt.textContent=banda+" - Track "+(i+1);
      selector.appendChild(opt);
    });
  }
}
function playPreviewSong(banda){
  if(!cancionesBandas[banda]) return;
  if(audio.dataset.lastBand===banda) return;
  let lista=cancionesBandas[banda];
  let randomUrl=lista[Math.floor(Math.random()*lista.length)];
  audio.src=randomUrl;
  audio.volume=0.6;
  audio.play().catch(()=>{});
  audio.dataset.lastBand=banda;
  for(let opt of selector.options){ if(opt.dataset.banda===banda && opt.value===randomUrl){ selector.value=randomUrl; break; } }
  document.getElementById("bono-info").textContent="♪ Sonando: "+banda;
}
function manualSongChange(){
  if(selector.value){ audio.src=selector.value; audio.play().catch(()=>{}); audio.dataset.lastBand=selector.options[selector.selectedIndex].dataset.banda||""; }
}
function playFlipSound(){
  try{ const ctx=new (window.AudioContext||window.webkitAudioContext)(); const o=ctx.createOscillator(); const g=ctx.createGain(); o.type="sine"; o.frequency.value=800; g.gain.value=0.15; o.connect(g); g.connect(ctx.destination); o.start(); g.gain.exponentialRampToValueAtTime(0.01,ctx.currentTime+0.3); setTimeout(()=>ctx.close(),400);}catch(e){}
}
function playRandomBandSong(banda){
  playPreviewSong(banda);
  document.getElementById("bono-banner").style.display="block";
  document.getElementById("bono-text").textContent=banda;
  setTimeout(()=>{document.getElementById("bono-banner").style.display="none";},3000);
}
function createRandomCard(){
  return masterDeck[Math.floor(Math.random()*masterDeck.length)];
}
function initGame(){
  hand=[]; selectedIndex=null;
  for(let i=0;i<5;i++) hand.push(createRandomCard());
  updateUI(); document.getElementById("player-slot").innerHTML="TÚ"; document.getElementById("enemy-slot").innerHTML="ENEMIGO";
}
function updateUI(){
  const gameDiv=document.getElementById("game"); gameDiv.innerHTML="";
  hand.forEach((c,i)=>{
    let div=document.createElement("div"); div.className="card"+(i===selectedIndex?" selected":"");
    div.innerHTML=`<img class="card-img" src="${c.img}" onerror="this.src='${placeholder}'"><div class="card-band">${c.banda}</div><div class="card-name">${c.nombre}</div><div style="font-size:.6rem;padding:0 4px">${c.rol}</div>`;
    div.onclick=()=>selectCard(i); gameDiv.appendChild(div);
  });
  document.getElementById("hp").textContent=hp; document.getElementById("pts").textContent=pts;
}
function selectCard(index){
  selectedIndex=index; let card=hand[index];
  document.getElementById("player-slot").innerHTML=`<div style="text-align:center"><img src="${card.img}" onerror="this.src='${placeholder}'" style="width:100%;height:80px;object-fit:cover"><div style="font-size:.7rem;color:#ffcc00">${card.banda}</div><div style="font-size:.8rem;font-weight:bold">${card.nombre}</div></div>`;
  playPreviewSong(card.banda); playFlipSound(); updateUI();
}
function executeBattle(){
  if(selectedIndex===null){ alert("Selecciona una carta!"); return; }
  let player=hand[selectedIndex]; let enemy=createRandomCard();
  document.getElementById("enemy-slot").innerHTML=`<div style="text-align:center"><img src="${enemy.img}" onerror="this.src='${placeholder}'" style="width:100%;height:80px;object-fit:cover"><div style="font-size:.7rem;color:#ffcc00">${enemy.banda}</div><div style="font-size:.8rem;font-weight:bold">${enemy.nombre}</div></div>`;
  let win=Math.random()>0.5;
  if(win){ pts+=10; playRandomBandSong(player.banda); } else { hp-=10; if(hp<0) hp=0; }
  updateUI();
  if(hp<=0){ alert("Game Over! Puntos: "+pts); hp=100; pts=0; initGame(); }
}
initSongs(); initGame();
</script>
</body>
</html>
